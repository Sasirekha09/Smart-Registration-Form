
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #007bff;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .error {
            color: #dc3545;
            font-size: 13px;
            margin-top: 5px;
            display: block;
        }

        .counter {
            text-align: right;
            font-size: 13px;
            color: #666;
            margin-top: 5px;
        }

        .warning {
            color: #dc3545;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .success {
            color: #198754;
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Registration Form</h2>

    <form id="registrationForm" novalidate>

        <!-- Name -->
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your name">
            <span class="error" id="nameError"></span>
        </div>

        <!-- Email -->
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email">
            <span class="error" id="emailError"></span>
        </div>

        <!-- Password -->
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password"
                   placeholder="Minimum 6 characters">
            <span class="error" id="passwordError"></span>
        </div>

        <!-- Bio -->
        <div class="form-group">
            <label for="bio">Bio</label>
            <textarea id="bio" maxlength="200"
                      placeholder="Write something about yourself..."></textarea>

            <div class="counter" id="counter">
                0 / 200 characters
            </div>

            <span class="error" id="bioError"></span>
        </div>

        <button type="submit" id="submitBtn" disabled>
            Submit
        </button>

        <p class="success" id="successMessage"></p>

    </form>
</div>

<script>
    // Get HTML elements
    const name = document.getElementById("name");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const bio = document.getElementById("bio");

    const submitBtn = document.getElementById("submitBtn");
    const counter = document.getElementById("counter");
    const successMessage =
        document.getElementById("successMessage");

    // Validate Name
    function validateName() {
        const value = name.value.trim();

        if (value === "") {
            document.getElementById("nameError").textContent =
                "Name is required.";
            return false;
        }

        document.getElementById("nameError").textContent = "";
        return true;
    }

    // Validate Email
    function validateEmail() {
        const value = email.value.trim();

        const emailPattern =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (value === "") {
            document.getElementById("emailError").textContent =
                "Email is required.";
            return false;
        }

        if (!emailPattern.test(value)) {
            document.getElementById("emailError").textContent =
                "Please enter a valid email address.";
            return false;
        }

        document.getElementById("emailError").textContent = "";
        return true;
    }

    // Validate Password
    function validatePassword() {
        const value = password.value;

        if (value === "") {
            document.getElementById("passwordError").textContent =
                "Password is required.";
            return false;
        }

        if (value.length < 6) {
            document.getElementById("passwordError").textContent =
                "Password must contain at least 6 characters.";
            return false;
        }

        document.getElementById("passwordError").textContent = "";
        return true;
    }

    // Validate Bio and update character counter
    function validateBio() {
        const value = bio.value;

        counter.textContent =
            `${value.length} / 200 characters`;

        if (value.length >= 180) {
            counter.classList.add("warning");
        } else {
            counter.classList.remove("warning");
        }

        if (value.trim() === "") {
            document.getElementById("bioError").textContent =
                "Bio is required.";
            return false;
        }

        document.getElementById("bioError").textContent = "";
        return true;
    }

    // Check whether all fields are valid
    function checkForm() {
        const isNameValid = validateName();
        const isEmailValid = validateEmail();
        const isPasswordValid = validatePassword();
        const isBioValid = validateBio();

        submitBtn.disabled = !(
            isNameValid &&
            isEmailValid &&
            isPasswordValid &&
            isBioValid
        );
    }

    // Real-time validation using input events
    [name, email, password, bio].forEach(input => {
        input.addEventListener("input", () => {
            successMessage.textContent = "";
            checkForm();
        });
    });

    // Handle form submission
    document.getElementById("registrationForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            checkForm();

            if (!submitBtn.disabled) {
                successMessage.textContent =
                    "Registration successful!";

                this.reset();

                counter.textContent = "0 / 200 characters";
                counter.classList.remove("warning");

                submitBtn.disabled = true;
            }
        });

</script>

</body>
</html>
